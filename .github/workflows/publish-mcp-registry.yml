name: Publish MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - "mcp-plugin/server.json"
      - ".github/workflows/publish-mcp-registry.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Authenticate with MCP Registry via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Validate and publish server.json
        working-directory: mcp-plugin
        run: |
          mcp-publisher validate
          mcp-publisher publish
